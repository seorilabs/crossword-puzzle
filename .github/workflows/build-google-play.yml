name: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 릴리즈 태그입니다. 업로드 시에는 vX.Y.Z 태그를 지정해야 합니다."
        required: false
        type: string
      upload_to_internal:
        description: "Google Play internal track에 AAB 업로드"
        required: false
        default: true
        type: boolean
      release_status:
        description: "internal track release status"
        required: false
        default: "completed"
        type: choice
        options:
          - draft
          - completed
      changes_not_sent_for_review:
        description: "검토 제출 없이 edit commit"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-aab-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ inputs.release_tag }}"
          if [ "${{ inputs.upload_to_internal }}" = "true" ] && [ -z "$release_tag" ]; then
            echo "release_tag is required when upload_to_internal is true." >&2
            exit 1
          fi

          args=()
          if [ -n "$release_tag" ]; then
            args+=(--tag "$release_tag")
          fi

          node scripts/resolve-release-version.mjs "${args[@]}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Lint
        run: npm run lint

      - name: Print current Google Play readiness
        continue-on-error: true
        run: npm run check:play -- --json

      - name: Resolve Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          if [ -x apps/mobile/android/gradlew ]; then
            android_dir="apps/mobile/android"
            aab_path="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          elif [ -x android/gradlew ]; then
            android_dir="android"
            aab_path="android/app/build/outputs/bundle/release/app-release.aab"
          else
            echo "No Android Gradle project found. Add apps/mobile/android or android before building a Google Play AAB." >&2
            exit 1
          fi

          {
            echo "android_dir=$android_dir"
            echo "aab_path=$aab_path"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            echo "sdkmanager not found at $sdkmanager_bin" >&2
            exit 1
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager_bin" --licenses >/dev/null
          licenses_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$licenses_status" -ne 0 ]; then
            exit "$licenses_status"
          fi

          "$sdkmanager_bin" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "cmdline-tools;latest"

      - name: Validate signing secrets
        shell: bash
        env:
          GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 secret is required." >&2
            exit 1
          fi

          if [ -z "$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD secret is required." >&2
            exit 1
          fi

      - name: Restore Google Play upload keystore
        shell: bash
        env:
          GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_DIR: ${{ steps.android.outputs.android_dir }}
        run: |
          set -euo pipefail

          signing_dir="$RUNNER_TEMP/crossword-puzzle-signing"
          keystore_path="$signing_dir/crossword-puzzle-upload-key.jks"
          key_alias="${GOOGLE_PLAY_UPLOAD_KEY_ALIAS:-crossword-puzzle-upload}"
          key_password="${GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:-$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD}"

          mkdir -p "$signing_dir"
          printf '%s' "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$key_alias"
            printf 'keyPassword=%s\n' "$key_password"
          } > "$ANDROID_DIR/key.properties"
          chmod 600 "$ANDROID_DIR/key.properties"

      - name: Build signed Android AAB
        working-directory: ${{ steps.android.outputs.android_dir }}
        env:
          APP_VERSION_NAME: ${{ steps.release.outputs.version }}
          APP_VERSION_CODE: ${{ steps.release.outputs.android_version_code }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload AAB artifact
        if: ${{ !inputs.upload_to_internal }}
        uses: actions/upload-artifact@v7
        with:
          name: crossword-puzzle-google-play-aab-${{ steps.release.outputs.release_name }}
          path: ${{ steps.android.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 3

      - name: Validate Google Play WIF config
        if: ${{ inputs.upload_to_internal }}
        shell: bash
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_WORKLOAD_IDENTITY_PROVIDER" ]; then
            echo "GOOGLE_WORKLOAD_IDENTITY_PROVIDER repository variable is required to upload to Google Play." >&2
            exit 1
          fi

          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL repository variable is required to upload to Google Play." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: ${{ inputs.upload_to_internal }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Install Google Play API client
        if: ${{ inputs.upload_to_internal }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-api-python-client google-auth google-auth-httplib2 httplib2

      - name: Upload AAB to Google Play internal track
        if: ${{ inputs.upload_to_internal }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --aab-path "${{ steps.android.outputs.aab_path }}"
            --release-name "${{ steps.release.outputs.release_name }}"
            --release-status "${{ inputs.release_status }}"
          )
          if [ "${{ inputs.changes_not_sent_for_review }}" = "true" ]; then
            args+=(--changes-not-sent-for-review)
          fi

          python3 scripts/upload-google-play-internal.py "${args[@]}"

      - name: Print remaining Google Play readiness blockers
        continue-on-error: true
        run: npm run check:play -- --json

name: Deploy All

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그입니다. 비우면 각 배포가 최신 vX.Y.Z 태그를 사용합니다. 예: v0.1.1"
        required: false
        type: string
      deploy_ait:
        description: "AIT(Apps in Toss) 배포 포함"
        required: false
        default: true
        type: boolean
      deploy_google_play:
        description: "Google Play 배포 포함"
        required: false
        default: true
        type: boolean
      deploy_app_store:
        description: "App Store(TestFlight) 배포 포함"
        required: false
        default: true
        type: boolean
      memo:
        description: "AIT 배포 메모입니다. 비우면 릴리즈 태그와 커밋이 자동으로 들어갑니다."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  ait:
    name: Deploy AIT
    if: ${{ inputs.deploy_ait }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}

  google-play:
    name: Deploy Google Play
    if: ${{ inputs.deploy_google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload_to_internal: true
      release_status: completed

  app-store:
    name: Deploy App Store
    if: ${{ inputs.deploy_app_store }}
    uses: ./.github/workflows/deploy-app-store.yml
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload_to_testflight: true

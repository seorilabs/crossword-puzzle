name: Deploy All

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그입니다. 비우면 각 배포가 최신 vX.Y.Z 태그를 사용합니다. 예: v0.1.1"
        required: false
        type: string
      deploy_ait:
        description: "AIT(Apps in Toss) 배포 포함"
        required: false
        default: true
        type: boolean
      deploy_google_play:
        description: "Google Play 배포 포함"
        required: false
        default: true
        type: boolean
      memo:
        description: "AIT 배포 메모입니다. 비우면 릴리즈 태그와 커밋이 자동으로 들어갑니다."
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    uses: seorilabs/.github/.github/workflows/resolve-release-version.yml@700348a9511b5ea202291ee1e1de4f73335783e0
    with:
      release_tag: ${{ inputs.release_tag }}

  ait:
    name: Deploy AIT
    needs: resolve
    if: ${{ inputs.deploy_ait }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      memo: ${{ inputs.memo }}

  google-play:
    name: Deploy Google Play
    needs: resolve
    if: ${{ inputs.deploy_google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload_to_internal: true
      release_status: completed


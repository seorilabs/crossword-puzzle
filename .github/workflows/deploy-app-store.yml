name: Deploy App Store

# iOS archive/업로드는 Xcode Cloud가 담당한다. 이 워크플로는 릴리즈 태그를 대상으로
# Xcode Cloud 빌드를 트리거하고 완료까지 기다리는 얇은 진입점이다.
#
# 왜 GitHub Actions에서 archive하지 않는가: Xcode 26.5부터 Firebase가 정적 라이브러리
# 지원을 끝내 use_frameworks! + RNFB 혼합 링키지가 필요해졌고, macOS runner 분량도
# 유한하다. 서명은 Xcode Cloud 매니지드 서명이 처리하므로 배포 인증서와 프로비저닝
# 프로파일 시크릿이 이 경로에 필요 없다.
#
# 빌드 준비(Node/CocoaPods 설치, Firebase 설정 복원, 태그→버전)는 저장소의
# apps/mobile/ios/ci_scripts/가 Xcode Cloud 안에서 수행한다.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그입니다. 비우면 최신 vX.Y.Z 태그를 사용합니다. 예: v1.0.0"
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그입니다. 비우면 최신 vX.Y.Z 태그를 사용합니다. 예: v1.0.0"
        required: false
        type: string
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: app-store-testflight-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    uses: seorilabs/.github/.github/workflows/resolve-release-version.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    with:
      release_tag: ${{ inputs.release_tag }}

  xcode-cloud:
    name: Trigger Xcode Cloud build
    needs: resolve
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 100
    environment: app-store

    env:
      IOS_BUNDLE_ID: com.seorilabs.crosswordpuzzle

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Trigger Xcode Cloud build and wait
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          node scripts/trigger-xcode-cloud-build.mjs \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --repo "${{ github.repository }}" \
            --timeout-minutes 90

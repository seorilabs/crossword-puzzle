name: Deploy App Store

# iOS archive와 업로드는 Xcode Cloud가 담당한다. 이 caller는 중앙 exact tag/source
# binding을 먼저 검증한 뒤 해당 태그의 Xcode Cloud build를 명시적으로 시작한다.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 exact stable vX.Y.Z 태그입니다. 비우면 최신 stable 태그를 사용합니다."
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: app-store-xcode-cloud-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact release source
    uses: seorilabs/.github/.github/workflows/resolve-release-version.yml@8a11a145fed35479a4a89ebc7ca97edd0a0f05fd
    with:
      release_tag: ${{ inputs.release_tag }}

  xcode-cloud:
    name: Trigger Xcode Cloud build
    needs: resolve
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 100
    environment: app-store

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false

      - name: Trigger Xcode Cloud build and wait
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          node scripts/trigger-xcode-cloud-build.mjs \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --bundle-id com.seorilabs.crosswordpuzzle \
            --repo "${{ github.repository }}" \
            --timeout-minutes 90

name: Deploy App Store

# iOS archive/업로드는 Xcode Cloud가 담당한다. 이 워크플로는 릴리즈 태그를 대상으로
# Xcode Cloud 빌드를 트리거하고 완료까지 기다리는 얇은 진입점이다.
#
# 왜 GitHub Actions에서 archive하지 않는가: Xcode 26.5부터 Firebase가 정적 라이브러리
# 지원을 끝내 use_frameworks! + RNFB 혼합 링키지가 필요해졌고, macOS runner 분량도
# 유한하다. 서명은 Xcode Cloud 매니지드 서명이 처리하므로 배포 인증서와 프로비저닝
# 프로파일 시크릿이 이 경로에 필요 없다.
#
# 빌드 준비(Node/CocoaPods 설치, Firebase 설정 복원, 태그→버전)는 저장소의
# apps/mobile/ios/ci_scripts/가 Xcode Cloud 안에서 수행한다.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그입니다. 비우면 최신 vX.Y.Z 태그를 사용합니다. 예: v1.0.0"
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그입니다. 비우면 최신 vX.Y.Z 태그를 사용합니다. 예: v1.0.0"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-testflight-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  xcode-cloud:
    name: Trigger Xcode Cloud build
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 100
    environment: app-store

    env:
      IOS_BUNDLE_ID: com.seorilabs.crosswordpuzzle

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "$tag" ]; then
              echo "release_tag가 비어 있고 vX.Y.Z 태그도 없습니다." >&2
              exit 1
            fi
            echo "release_tag가 비어 있어 최신 태그 $tag 를 사용합니다."
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "App Store 배포는 vX.Y.Z 릴리즈 태그가 필요합니다. 받은 값: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Trigger Xcode Cloud build and wait
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          node scripts/trigger-xcode-cloud-build.mjs \
            --tag "${{ steps.tag.outputs.tag }}" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --repo "${{ github.repository }}" \
            --timeout-minutes 90

name: Deploy App Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "업로드할 릴리즈 태그입니다. 비우면 최신 vX.Y.Z 태그를 사용합니다. 예: v1.0.0"
        required: false
        type: string
      upload_to_testflight:
        description: "archive 생성 후 App Store Connect/TestFlight에 업로드"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: "업로드할 릴리즈 태그입니다. 비우면 최신 vX.Y.Z 태그를 사용합니다. 예: v1.0.0"
        required: false
        type: string
      upload_to_testflight:
        description: "archive 생성 후 App Store Connect/TestFlight에 업로드"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: app-store-testflight-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  archive-upload:
    name: iOS archive and TestFlight upload
    runs-on: macos-26
    timeout-minutes: 70
    environment: app-store

    env:
      SHOULD_UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
      IOS_SCHEME: CrosswordPuzzleMobile
      IOS_WORKSPACE: apps/mobile/ios/CrosswordPuzzleMobile.xcworkspace
      IOS_BUNDLE_ID: com.seorilabs.crosswordpuzzle
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "$tag" ]; then
              echo "release_tag가 비어 있고 vX.Y.Z 태그도 없습니다." >&2
              exit 1
            fi
            echo "release_tag가 비어 있어 최신 태그 $tag 를 사용합니다."
          fi

          git -c advice.detachedHead=false checkout "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check release ref
        shell: bash
        env:
          APP_STORE_RELEASE_REF: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if [ "$SHOULD_UPLOAD_TO_TESTFLIGHT" = "true" ] && ! [[ "$APP_STORE_RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "TestFlight upload requires a vX.Y.Z release tag. Received: ${APP_STORE_RELEASE_REF:-empty}" >&2
            exit 1
          fi

      - name: Verify Xcode SDK
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          echo "iphoneos SDK: $sdk_version"

          if [ "$sdk_major" -lt 26 ]; then
            echo "App Store Connect uploads currently require Xcode 26 with iOS 26 SDK or later. Current iphoneos SDK: $sdk_version" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Resolve release version
        id: release
        shell: bash
        run: node scripts/resolve-release-version.mjs --tag "${{ steps.tag.outputs.tag }}"

      - name: Lint web app
        run: npm run lint

      - name: Validate puzzle packs
        run: npm run validate:puzzles

      - name: Lint mobile app
        run: npm --prefix apps/mobile run lint

      - name: Test mobile app
        run: npm --prefix apps/mobile test -- --watchAll=false

      - name: Print current App Store readiness
        continue-on-error: true
        run: npm run check:app-store -- --json

      - name: Install CocoaPods
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          bundle config set --local path vendor/bundle
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Validate signing and upload secrets
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          required_signing_vars=(
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
            APPLE_PROVISIONING_PROFILE_BASE64
            APPLE_KEYCHAIN_PASSWORD
            APPLE_TEAM_ID
          )

          for var_name in "${required_signing_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "$var_name is required." >&2
              exit 1
            fi
          done

          if [ "$SHOULD_UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            required_upload_vars=(
              APP_STORE_CONNECT_API_KEY_ID
              APP_STORE_CONNECT_ISSUER_ID
              APP_STORE_CONNECT_PRIVATE_KEY_BASE64
            )

            for var_name in "${required_upload_vars[@]}"; do
              if [ -z "${!var_name:-}" ]; then
                echo "$var_name is required when upload_to_testflight is true." >&2
                exit 1
              fi
            done
          fi

      - name: Restore Apple signing assets
        id: signing
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          decode_base64() {
            local encoded="$1"
            local output="$2"

            if ! printf '%s' "$encoded" | base64 --decode > "$output" 2>/dev/null; then
              printf '%s' "$encoded" | base64 -D > "$output"
            fi
          }

          signing_dir="$RUNNER_TEMP/crossword-puzzle-app-store-signing"
          keychain_path="$signing_dir/app-store-signing.keychain-db"
          certificate_path="$signing_dir/apple-distribution.p12"
          profile_path="$signing_dir/app-store.mobileprovision"

          mkdir -p "$signing_dir"
          decode_base64 "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" "$certificate_path"
          decode_base64 "$APPLE_PROVISIONING_PROFILE_BASE64" "$profile_path"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          profile_plist="$signing_dir/app-store-profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(plutil -extract UUID raw -o - "$profile_plist")"
          profile_name="$(plutil -extract Name raw -o - "$profile_plist")"
          profile_team_identifier="$(plutil -extract TeamIdentifier.0 raw -o - "$profile_plist")"
          profile_app_identifier="$(plutil -extract Entitlements.application-identifier raw -o - "$profile_plist")"
          profile_get_task_allow="$(plutil -extract Entitlements.get-task-allow raw -o - "$profile_plist")"
          profile_provisions_all_devices="$(plutil -extract ProvisionsAllDevices raw -o - "$profile_plist" 2>/dev/null || true)"
          profile_has_devices="false"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
            profile_has_devices="true"
          fi

          imported_cert_fingerprints="$(security find-certificate -a -Z -c "Apple Distribution" "$keychain_path" | awk '/SHA-1 hash:/{print $3}' | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')"

          profile_type="app-store"
          if [ "$profile_get_task_allow" = "true" ]; then
            profile_type="development"
          elif [ "$profile_has_devices" = "true" ]; then
            profile_type="ad-hoc"
          elif [ "$profile_provisions_all_devices" = "true" ]; then
            profile_type="enterprise"
          fi

          expected_app_identifier="$APPLE_TEAM_ID.$IOS_BUNDLE_ID"
          wildcard_app_identifier="$APPLE_TEAM_ID.*"
          profile_bundle_match="false"
          if [ "$profile_app_identifier" = "$expected_app_identifier" ] || [ "$profile_app_identifier" = "$wildcard_app_identifier" ]; then
            profile_bundle_match="true"
          fi

          profile_team_match="false"
          if [ "$profile_team_identifier" = "$APPLE_TEAM_ID" ]; then
            profile_team_match="true"
          fi

          echo "Provisioning profile diagnostics:"
          echo "  name: $profile_name"
          echo "  uuid: $profile_uuid"
          echo "  inferred type: $profile_type"
          echo "  team matches APPLE_TEAM_ID: $profile_team_match"
          echo "  bundle matches IOS_BUNDLE_ID: $profile_bundle_match"
          echo "  get-task-allow: $profile_get_task_allow"
          echo "  has provisioned devices: $profile_has_devices"
          echo "  provisions all devices: ${profile_provisions_all_devices:-false}"
          echo "  imported Apple Distribution certificate fingerprints: ${imported_cert_fingerprints:-none}"
          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$keychain_path"

          {
            echo "### App Store signing profile"
            echo ""
            echo "- name: $profile_name"
            echo "- uuid: $profile_uuid"
            echo "- inferred type: $profile_type"
            echo "- team matches APPLE_TEAM_ID: $profile_team_match"
            echo "- bundle matches IOS_BUNDLE_ID: $profile_bundle_match"
            echo "- get-task-allow: $profile_get_task_allow"
            echo "- has provisioned devices: $profile_has_devices"
            echo "- provisions all devices: ${profile_provisions_all_devices:-false}"
            echo "- imported Apple Distribution certificate fingerprints: ${imported_cert_fingerprints:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$profile_team_match" != "true" ]; then
            echo "Provisioning profile team does not match APPLE_TEAM_ID." >&2
            exit 1
          fi

          if [ "$profile_bundle_match" != "true" ]; then
            echo "Provisioning profile bundle does not match IOS_BUNDLE_ID=$IOS_BUNDLE_ID." >&2
            exit 1
          fi

          if [ "$profile_get_task_allow" != "false" ]; then
            echo "App Store provisioning profile must have get-task-allow=false." >&2
            exit 1
          fi

          if [ "$profile_has_devices" = "true" ] || [ "$profile_provisions_all_devices" = "true" ]; then
            echo "App Store provisioning profile must not include devices or provision all devices." >&2
            exit 1
          fi

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"

          {
            echo "keychain_path=$keychain_path"
            echo "profile_name=$profile_name"
            echo "profile_uuid=$profile_uuid"
          } >> "$GITHUB_OUTPUT"

      - name: Show resolved iOS signing settings
        shell: bash
        env:
          APPLE_MARKETING_VERSION: ${{ steps.release.outputs.apple_marketing_version }}
          APPLE_BUILD_NUMBER: ${{ steps.release.outputs.apple_build_number }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          RESOLVED_IOS_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail

          xcodebuild -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -showBuildSettings \
            MARKETING_VERSION="$APPLE_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$APPLE_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$RESOLVED_IOS_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            | awk '
              /Build settings for action build and target CrosswordPuzzleMobile:/ { in_app_target = 1; print; next }
              /Build settings for action build and target / { in_app_target = 0 }
              in_app_target && /CODE_SIGN|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|SDKROOT|MARKETING_VERSION|CURRENT_PROJECT_VERSION/ { print }
            '

      - name: Archive iOS app
        id: archive
        shell: bash
        env:
          APPLE_MARKETING_VERSION: ${{ steps.release.outputs.apple_marketing_version }}
          APPLE_BUILD_NUMBER: ${{ steps.release.outputs.apple_build_number }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          RESOLVED_IOS_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/CrosswordPuzzleMobile-v${APPLE_MARKETING_VERSION}-build${APPLE_BUILD_NUMBER}.xcarchive"

          xcodebuild archive \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            MARKETING_VERSION="$APPLE_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$APPLE_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$RESOLVED_IOS_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

          app_info_plist="$archive_path/Products/Applications/CrosswordPuzzleMobile.app/Info.plist"
          actual_marketing_version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app_info_plist")"
          actual_build_number="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app_info_plist")"

          if [ "$actual_marketing_version" != "$APPLE_MARKETING_VERSION" ]; then
            echo "Archive marketing version mismatch: $actual_marketing_version != $APPLE_MARKETING_VERSION" >&2
            exit 1
          fi

          if [ "$actual_build_number" != "$APPLE_BUILD_NUMBER" ]; then
            echo "Archive build number mismatch: $actual_build_number != $APPLE_BUILD_NUMBER" >&2
            exit 1
          fi

          {
            echo "archive_path=$archive_path"
            echo "marketing_version=$actual_marketing_version"
            echo "build_number=$actual_build_number"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### App Store archive"
            echo ""
            echo "- archive: $archive_path"
            echo "- CFBundleShortVersionString: $actual_marketing_version"
            echo "- CFBundleVersion: $actual_build_number"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload xcarchive artifact
        if: env.SHOULD_UPLOAD_TO_TESTFLIGHT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: crossword-puzzle-app-store-archive-v${{ steps.archive.outputs.marketing_version }}-build${{ steps.archive.outputs.build_number }}-${{ github.sha }}
          path: ${{ steps.archive.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 3

      - name: Prepare App Store Connect API key
        if: env.SHOULD_UPLOAD_TO_TESTFLIGHT == 'true'
        id: app-store-api-key
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          api_key_dir="$RUNNER_TEMP/app-store-connect-api-key"
          api_key_path="$api_key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$api_key_dir"

          if ! printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key_path" 2>/dev/null; then
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D > "$api_key_path"
          fi

          chmod 600 "$api_key_path"
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Upload archive to App Store Connect
        if: env.SHOULD_UPLOAD_TO_TESTFLIGHT == 'true'
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ steps.app-store-api-key.outputs.api_key_path }}
          RESOLVED_IOS_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail

          export_options_plist="$RUNNER_TEMP/AppStoreExportOptions.plist"
          export_path="$RUNNER_TEMP/app-store-export"

          cat > "$export_options_plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${RESOLVED_IOS_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "$export_options_plist"

          xcodebuild -exportArchive \
            -archivePath "${{ steps.archive.outputs.archive_path }}" \
            -exportOptionsPlist "$export_options_plist" \
            -exportPath "$export_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

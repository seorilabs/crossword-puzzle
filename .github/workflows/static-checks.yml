# main 정적 게이트: org 표준 재사용 워크플로우 caller.
# 로직은 seorilabs/.github의 rn-static-checks.yml에 있고, 여기서는 명령만 주입한다.
# 기존 ci.yml(web + mobile 두 잡)의 체크를 그대로 재현한다. 배포/무거운 빌드 없음.
name: Static Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/rn-static-checks.yml@565fba53aa5053785c63c9b732b93a3fbd7be847
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
      # RPI ARM 러너에서 install 5분 + checks 14~15분(test:core 의 생성기 CLI e2e 포함)로
      # 기본 20분에 걸려 취소되는 일이 생겼다. 상한만 넉넉히 두고 e2e 비용은 별도로 줄인다.
      timeout_minutes: 30
      node_version: "24"
      package_manager: npm
      install_command: |
        npm ci
        npm ci --prefix apps/mobile
      check_command: |
        npm run lint
        npm run typecheck
        npm run validate:puzzles
        npm run test:adapters
        npm run test:core
        npm run test:components
        npm run build
        npm run check:release-parity
        npm run check:mobile

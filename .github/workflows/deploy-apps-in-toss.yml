name: Deploy AIT

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 exact stable vX.Y.Z 태그입니다. 비우면 최신 stable 태그를 사용합니다."
        required: false
        type: string
      memo:
        description: "canonical 릴리즈 메모 뒤에 붙일 운영 메모"
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
      memo:
        required: false
        default: ""
        type: string
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: crossword-puzzle-apps-in-toss-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/rn-deploy-ait.yml@8a11a145fed35479a4a89ebc7ca97edd0a0f05fd
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      ait_dir: .
      package_manager: npm
      node_version: 24.16.0
      npm_registry_url: https://npm.pkg.github.com
      npm_scope: "@seorilabs"
      install_command: npm ci
      build_command: |
        export VITE_PUZZLE_PACK_BASE_URL="${{ vars.PUZZLE_PACK_BASE_URL || 'https://crossword-puzzle-79ae0.web.app' }}"
        export VITE_RETURN_REMINDER_TEMPLATE_CODE="${{ vars.RETURN_REMINDER_TEMPLATE_CODE || '' }}"
        export VITE_APP_VERSION="$SEORI_RELEASE_VERSION"
        export VITE_RELEASE_TAG="$SEORI_RELEASE_TAG"
        if [ -z "${VITE_RETURN_REMINDER_TEMPLATE_CODE//[[:space:]]/}" ]; then
          echo "::error::RETURN_REMINDER_TEMPLATE_CODE repository variable is required."
          exit 1
        fi
        npm run lint
        npm run build
      artifact_path: crossword-puzzle-game.ait
      timeout_minutes: 25

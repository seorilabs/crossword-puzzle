name: Deploy AIT

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드하고 배포할 exact stable SemVer 태그. 비우면 최신 vX.Y.Z"
        required: false
        type: string
        default: ""
      memo:
        description: "canonical release memo 뒤에 붙일 운영 메모"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_tag: { required: false, type: string, default: "" }
      memo: { required: false, type: string, default: "" }
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: crossword-puzzle-apps-in-toss-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/rn-deploy-ait.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      ait_dir: .
      package_manager: npm
      node_version: 24.16.0
      npm_registry_url: https://npm.pkg.github.com
      npm_scope: "@seorilabs"
      install_command: npm ci
      build_command: >-
        test -n "${{ vars.RETURN_REMINDER_TEMPLATE_CODE }}" &&
        VITE_PUZZLE_PACK_BASE_URL="${{ vars.PUZZLE_PACK_BASE_URL || 'https://crossword-puzzle-79ae0.web.app' }}"
        VITE_RETURN_REMINDER_TEMPLATE_CODE="${{ vars.RETURN_REMINDER_TEMPLATE_CODE }}"
        VITE_APP_VERSION="$SEORI_RELEASE_VERSION"
        VITE_RELEASE_TAG="$SEORI_RELEASE_TAG"
        npm run build
      artifact_path: "*.ait"
      timeout_minutes: 30
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}

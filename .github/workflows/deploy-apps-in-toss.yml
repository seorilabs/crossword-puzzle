name: Deploy AIT

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드하고 배포할 exact stable SemVer 태그. 비우면 최신 vX.Y.Z"
        required: false
        type: string
        default: ""
      memo:
        description: "canonical release memo 뒤에 붙일 운영 메모"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_tag: { required: false, type: string, default: "" }
      memo: { required: false, type: string, default: "" }
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: crossword-puzzle-apps-in-toss-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/rn-deploy-ait.yml@main
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      ait_dir: .
      package_manager: npm
      node_version: 24.16.0
      install_command: npm ci
      build_command: |
        template_code="${{ vars.RETURN_REMINDER_TEMPLATE_CODE }}"
        if [ -z "${template_code//[[:space:]]/}" ]; then
          echo "::error::RETURN_REMINDER_TEMPLATE_CODE repository variable is required."
          exit 1
        fi
        puzzle_pack_base_url="${{ vars.PUZZLE_PACK_BASE_URL || 'https://crossword-puzzle-79ae0.web.app' }}"
        if [ -z "${puzzle_pack_base_url//[[:space:]]/}" ]; then
          echo "::error::PUZZLE_PACK_BASE_URL is required. 비우면 번들 내장 폴백 팩으로 조용히 내려간다."
          exit 1
        fi
        release_version="${SEORI_RELEASE_VERSION:-}"
        release_tag="${SEORI_RELEASE_TAG:-}"
        if [ -z "${release_version//[[:space:]]/}" ] || [ -z "${release_tag//[[:space:]]/}" ]; then
          echo "::error::SEORI_RELEASE_VERSION/SEORI_RELEASE_TAG must come from the central release workflow."
          exit 1
        fi
        # export 하지 않으면 자식 프로세스인 vite가 값을 보지 못한다. 그러면 퍼즐 팩
        # 주소가 비어 번들 내장 6월 폴백 팩이 나가고 release_version이 package.json
        # 기본값으로 떨어진다(#406). 반드시 export로 환경에 실어 보낸다.
        export VITE_PUZZLE_PACK_BASE_URL="$puzzle_pack_base_url"
        export VITE_RETURN_REMINDER_TEMPLATE_CODE="$template_code"
        export VITE_APP_VERSION="$release_version"
        export VITE_RELEASE_TAG="$release_tag"
        npm run build
      artifact_path: "*.ait"
      timeout_minutes: 30
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}

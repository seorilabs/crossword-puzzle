name: Deploy Google Play

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 exact stable vX.Y.Z 태그입니다. 비우면 최신 stable 태그를 사용합니다."
        required: false
        type: string
      upload_to_internal:
        description: "Google Play internal track에 AAB 업로드"
        required: false
        default: true
        type: boolean
      release_status:
        description: "internal track release status"
        required: false
        default: "completed"
        type: choice
        options:
          - draft
          - completed
      changes_not_sent_for_review:
        description: "검토 제출 없이 edit commit"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
      upload_to_internal:
        required: false
        default: true
        type: boolean
      release_status:
        required: false
        default: "completed"
        type: string
      changes_not_sent_for_review:
        required: false
        default: false
        type: boolean
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:
        required: true
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: true
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: true
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: google-play-aab-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/rn-deploy-google-play.yml@8a11a145fed35479a4a89ebc7ca97edd0a0f05fd
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
    with:
      release_tag: ${{ inputs.release_tag }}
      package_name: com.seorilabs.crosswordpuzzle
      upload: ${{ github.event_name != 'push' && inputs.upload_to_internal }}
      track: internal
      release_status: ${{ inputs.release_status }}
      changes_not_sent_for_review: ${{ inputs.changes_not_sent_for_review }}
      package_manager: npm
      node_version: 24.16.0
      npm_registry_url: https://npm.pkg.github.com
      npm_scope: "@seorilabs"
      java_version: 17
      android_dir: apps/mobile/android
      firebase_restore_script: scripts/restore-mobile-firebase-config.mjs
      timeout_minutes: 55

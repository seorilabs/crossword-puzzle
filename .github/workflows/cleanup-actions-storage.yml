# Actions 스토리지 정리: org 표준 재사용 워크플로우 caller.
# 로직은 seorilabs/.github의 cleanup-actions-storage.yml에 있고, 여기서는 얇게 호출만 한다.
name: Cleanup GitHub Actions Storage

on:
  workflow_dispatch:
    inputs:
      delete_artifacts:
        description: "Workflow artifacts를 삭제합니다."
        required: false
        default: true
        type: boolean
      delete_caches:
        description: "Actions caches를 삭제합니다."
        required: false
        default: true
        type: boolean
      dry_run:
        description: "삭제하지 않고 대상과 용량만 출력합니다."
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-storage
  cancel-in-progress: false

jobs:
  cleanup:
    uses: seorilabs/.github/.github/workflows/cleanup-actions-storage.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
      delete_artifacts: ${{ inputs.delete_artifacts }}
      delete_caches: ${{ inputs.delete_caches }}
      dry_run: ${{ inputs.dry_run }}

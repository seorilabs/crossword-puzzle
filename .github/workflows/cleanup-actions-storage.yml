name: Cleanup GitHub Actions Storage

on:
  workflow_dispatch:
    inputs:
      delete_artifacts:
        description: "Workflow artifacts를 삭제합니다."
        required: false
        default: true
        type: boolean
      delete_caches:
        description: "Actions caches를 삭제합니다."
        required: false
        default: true
        type: boolean
      dry_run:
        description: "삭제하지 않고 대상과 용량만 출력합니다."
        required: false
        default: false
        type: boolean

permissions:
  actions: write

concurrency:
  group: cleanup-actions-storage
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete Actions artifacts and caches
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DELETE_ARTIFACTS: ${{ inputs.delete_artifacts }}
      DELETE_CACHES: ${{ inputs.delete_caches }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Delete workflow artifacts
        if: env.DELETE_ARTIFACTS == 'true'
        shell: bash
        run: |
          set -euo pipefail

          human_bytes() {
            awk -v bytes="${1:-0}" '
              BEGIN {
                split("B KiB MiB GiB TiB", units)
                value = bytes
                unit = 1
                while (value >= 1024 && unit < 5) {
                  value /= 1024
                  unit += 1
                }
                printf "%.2f %s", value, units[unit]
              }
            '
          }

          artifact_rows="$(gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv')"

          if [ -z "$artifact_rows" ]; then
            echo "No workflow artifacts found."
            {
              echo "### Workflow artifacts"
              echo ""
              echo "- candidates: 0"
              echo "- deleted: 0"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          artifact_count="$(printf '%s\n' "$artifact_rows" | awk 'NF { count += 1 } END { print count + 0 }')"
          artifact_bytes="$(printf '%s\n' "$artifact_rows" | awk -F '\t' '{ sum += $3 } END { print sum + 0 }')"
          artifact_human="$(human_bytes "$artifact_bytes")"

          echo "Found $artifact_count workflow artifacts using $artifact_human."

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; workflow artifacts were not deleted."
            {
              echo "### Workflow artifacts"
              echo ""
              echo "- mode: dry-run"
              echo "- candidates: $artifact_count"
              echo "- size: $artifact_human ($artifact_bytes bytes)"
              echo "- deleted: 0"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          deleted_count=0
          while IFS=$'\t' read -r artifact_id artifact_name artifact_size; do
            if [ -z "${artifact_id:-}" ]; then
              continue
            fi

            echo "Deleting artifact #$artifact_id ($artifact_name, $artifact_size bytes)"
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id" >/dev/null
            deleted_count=$((deleted_count + 1))
          done <<< "$artifact_rows"

          {
            echo "### Workflow artifacts"
            echo ""
            echo "- candidates: $artifact_count"
            echo "- size: $artifact_human ($artifact_bytes bytes)"
            echo "- deleted: $deleted_count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete Actions caches
        if: env.DELETE_CACHES == 'true'
        shell: bash
        run: |
          set -euo pipefail

          human_bytes() {
            awk -v bytes="${1:-0}" '
              BEGIN {
                split("B KiB MiB GiB TiB", units)
                value = bytes
                unit = 1
                while (value >= 1024 && unit < 5) {
                  value /= 1024
                  unit += 1
                }
                printf "%.2f %s", value, units[unit]
              }
            '
          }

          cache_rows="$(gh api --paginate "repos/$GH_REPO/actions/caches?per_page=100" --jq '.actions_caches[] | [.id, .key, .ref, .size_in_bytes] | @tsv')"

          if [ -z "$cache_rows" ]; then
            echo "No Actions caches found."
            {
              echo "### Actions caches"
              echo ""
              echo "- candidates: 0"
              echo "- deleted: 0"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cache_count="$(printf '%s\n' "$cache_rows" | awk 'NF { count += 1 } END { print count + 0 }')"
          cache_bytes="$(printf '%s\n' "$cache_rows" | awk -F '\t' '{ sum += $4 } END { print sum + 0 }')"
          cache_human="$(human_bytes "$cache_bytes")"

          echo "Found $cache_count Actions caches using $cache_human."

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; Actions caches were not deleted."
            {
              echo "### Actions caches"
              echo ""
              echo "- mode: dry-run"
              echo "- candidates: $cache_count"
              echo "- size: $cache_human ($cache_bytes bytes)"
              echo "- deleted: 0"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          deleted_count=0
          while IFS=$'\t' read -r cache_id cache_key cache_ref cache_size; do
            if [ -z "${cache_id:-}" ]; then
              continue
            fi

            echo "Deleting cache #$cache_id ($cache_key, $cache_ref, $cache_size bytes)"
            gh api --method DELETE "repos/$GH_REPO/actions/caches/$cache_id" >/dev/null
            deleted_count=$((deleted_count + 1))
          done <<< "$cache_rows"

          {
            echo "### Actions caches"
            echo ""
            echo "- candidates: $cache_count"
            echo "- size: $cache_human ($cache_bytes bytes)"
            echo "- deleted: $deleted_count"
          } >> "$GITHUB_STEP_SUMMARY"

name: Release Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "tag 미지정 시 증가 단위"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      tag:
        description: "직접 지정할 exact stable tag vX.Y.Z"
        required: false
        default: ""
        type: string
      target_ref:
        description: "태그를 붙일 ref 또는 commit SHA"
        required: false
        default: main
        type: string
      dry_run:
        description: "태그를 push하지 않고 계산과 검증만 수행"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  tag:
    uses: seorilabs/.github/.github/workflows/release-tag.yml@8a11a145fed35479a4a89ebc7ca97edd0a0f05fd
    with:
      target_ref: ${{ inputs.target_ref || github.ref_name }}
      tag: ${{ inputs.tag }}
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}

name: Release Tag

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "생성할 semver 증가 단위입니다. main 자동 태그는 항상 patch를 사용합니다."
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      target_ref:
        description: "태그를 붙일 브랜치, 태그, 또는 커밋 SHA입니다."
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: release-tag-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_ref }}
  cancel-in-progress: false

jobs:
  create:
    name: Create semver release tag
    runs-on: seorilabs-rpi-arm64
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Check existing release tag on automated run
        id: existing
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$existing_tag" ]; then
            echo "Automated release tag already exists on this commit: $existing_tag"
            {
              echo "skip=true"
              echo "tag=$existing_tag"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Resolve next release tag
        if: steps.existing.outputs.skip != 'true'
        id: next
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: node scripts/next-release-tag.mjs --bump "$BUMP"

      - name: Create release tag
        if: steps.existing.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.next.outputs.tag }}
          RELEASE_VERSION: ${{ steps.next.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$target_sha" -m "Release $RELEASE_TAG ($short_sha)"
          git push origin "refs/tags/$RELEASE_TAG"

          echo "Created $RELEASE_TAG for version $RELEASE_VERSION at $short_sha."

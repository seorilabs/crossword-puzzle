name: Release Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "태그를 직접 지정하지 않을 때 증가 단위"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      tag:
        description: "생성할 exact stable SemVer 태그. 예: v1.2.3"
        required: false
        default: ""
        type: string
      target_ref:
        description: "태그를 붙일 ref. 비우면 dispatch한 ref"
        required: false
        default: ""
        type: string
      dry_run:
        description: "태그를 만들지 않고 계산만 검증"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-tag-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    uses: seorilabs/.github/.github/workflows/release-tag.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    with:
      target_ref: ${{ inputs.target_ref || github.ref_name }}
      tag: ${{ inputs.tag }}
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}

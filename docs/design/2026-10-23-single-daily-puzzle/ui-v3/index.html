<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>하루 한 판 — 음절 타일 시안</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="gallery-head">
    <div class="eyebrow">CROSSWORD / TILE BOARD / 03</div>
    <h1>키보드 없이, 한 칸씩 한 판 가득.</h1>
    <p>A안의 입체 타일과 고정된 8×8 보드. 단어를 바꿔도 후보 영역과 입력 버튼은 제자리에.</p>
    <div class="gallery-toolbar">
      <div class="language-tabs" role="group" aria-label="시안 언어">
        <button data-locale="ko" class="active">한국어</button>
        <button data-locale="en">English</button>
      </div>
      <button class="reset-demo">시안 초기 상태로</button>
      <span class="design-label">눌러보는 설계 시안 · 앱 반영 전</span>
    </div>
  </header>
  <main id="gallery"></main>
  <footer class="gallery-footer">
    <span>왼쪽 화면의 타일을 눌러 한 판을 끝까지 풀 수 있습니다. 입력은 이 시안의 별도 저장 공간에만 보관합니다.</span>
    <span>키보드 대신 큰 타일, 맞는 글자는 유지, 한 판의 단어 수는 그대로.</span>
  </footer>
  <script src="../ui-v2/sample-data.js"></script>
  <script src="demo.js"></script>
</body>
</html>

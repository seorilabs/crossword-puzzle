substitutions:
  _ANDROID_BUILDER_IMAGE: "asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder"
  _ANDROID_BUILDER_TAG: "node24-jdk17-android36"
  _RELEASE_TAG: ""
  _ANDROID_VERSION_NAME: ""
  _ANDROID_VERSION_CODE: ""
  _GOOGLE_PLAY_UPLOAD_KEY_ALIAS: ""
  _PLAY_GAMES_PROJECT_ID: ""
  _PLAY_GAMES_LEADERBOARD_ID: ""
  _CREDENTIAL_BUCKET: ""
  _ARTIFACT_BUCKET: ""

steps:
  - id: fetch-ephemeral-credentials
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        install -d -m 0700 /workspace/.ci-secrets
        for name in \
          firebase-android-config.b64 \
          play-keystore.b64 \
          play-keystore-password \
          play-key-password \
          github-packages-token; do
          gcloud storage cp "${_CREDENTIAL_BUCKET}/$$name" "/workspace/.ci-secrets/$$name"
          chmod 0600 "/workspace/.ci-secrets/$$name"
        done
        gcloud storage rm --recursive "${_CREDENTIAL_BUCKET}" || true

  - id: build-signed-aab
    name: ${_ANDROID_BUILDER_IMAGE}:${_ANDROID_BUILDER_TAG}
    entrypoint: bash
    args:
      - scripts/build-android.sh
    env:
      - RELEASE_TAG=${_RELEASE_TAG}
      - ANDROID_VERSION_NAME=${_ANDROID_VERSION_NAME}
      - ANDROID_VERSION_CODE=${_ANDROID_VERSION_CODE}
      - GOOGLE_PLAY_UPLOAD_KEY_ALIAS=${_GOOGLE_PLAY_UPLOAD_KEY_ALIAS}
      - PLAY_GAMES_PROJECT_ID=${_PLAY_GAMES_PROJECT_ID}
      - PLAY_GAMES_LEADERBOARD_ID=${_PLAY_GAMES_LEADERBOARD_ID}
      - BUILD_CREDENTIAL_DIR=/workspace/.ci-secrets

artifacts:
  objects:
    location: ${_ARTIFACT_BUCKET}
    paths:
      - dist/android/crossword-puzzle.aab

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3000s

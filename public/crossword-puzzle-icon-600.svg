<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">가로세로 낱말 퍼즐 앱 로고</title>
  <desc id="desc">초록 배경 위에 한글 낱말이 교차하는 퍼즐판 심볼</desc>
  <rect width="600" height="600" fill="#00A88F"/>
  <g transform="translate(60 60) scale(1.38)">
    <rect x="0" y="0" width="348" height="348" fill="#D6DEE6"/>
    <g font-family="Apple SD Gothic Neo, Pretendard, system-ui, sans-serif" font-size="48" font-weight="800" text-anchor="middle" dominant-baseline="central">
      <rect x="8" y="8" width="60" height="60" fill="#FFFFFF"/>
      <text x="38" y="38" fill="#191F28">가</text>
      <rect x="78" y="8" width="60" height="60" fill="#FFFFFF"/>
      <text x="108" y="38" fill="#191F28">로</text>
      <rect x="148" y="8" width="60" height="60" fill="#4E5968"/>
      <rect x="218" y="8" width="60" height="60" fill="#FFFFFF"/>
      <rect x="288" y="8" width="52" height="60" fill="#4E5968"/>

      <rect x="8" y="78" width="60" height="60" fill="#4E5968"/>
      <rect x="78" y="78" width="60" height="60" fill="#FFFFFF"/>
      <text x="108" y="108" fill="#191F28">세</text>
      <rect x="148" y="78" width="60" height="60" fill="#FFFFFF"/>
      <text x="178" y="108" fill="#191F28">로</text>
      <rect x="218" y="78" width="60" height="60" fill="#FFFFFF"/>
      <rect x="288" y="78" width="52" height="60" fill="#FFFFFF"/>

      <rect x="8" y="148" width="60" height="60" fill="#FFFFFF"/>
      <rect x="78" y="148" width="60" height="60" fill="#FFFFFF"/>
      <text x="108" y="178" fill="#191F28">낱</text>
      <rect x="148" y="148" width="60" height="60" fill="#4E5968"/>
      <rect x="218" y="148" width="60" height="60" fill="#FFFFFF"/>
      <rect x="288" y="148" width="52" height="60" fill="#4E5968"/>

      <rect x="8" y="218" width="60" height="60" fill="#FFFFFF"/>
      <rect x="78" y="218" width="60" height="60" fill="#FFFFFF"/>
      <text x="108" y="248" fill="#191F28">말</text>
      <rect x="148" y="218" width="60" height="60" fill="#FFFFFF"/>
      <rect x="218" y="218" width="60" height="60" fill="#FFFFFF"/>
      <rect x="288" y="218" width="52" height="60" fill="#FFFFFF"/>

      <rect x="8" y="288" width="60" height="52" fill="#4E5968"/>
      <rect x="78" y="288" width="60" height="52" fill="#FFFFFF"/>
      <text x="108" y="314" fill="#191F28">퍼</text>
      <rect x="148" y="288" width="60" height="52" fill="#FFFFFF"/>
      <text x="178" y="314" fill="#191F28">즐</text>
      <rect x="218" y="288" width="60" height="52" fill="#4E5968"/>
      <rect x="288" y="288" width="52" height="52" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
